<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tricorder</title>
  <meta name="description" content="Heart rate from your webcam, computed entirely in your browser (rPPG, POS algorithm).">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M2 17h7l3-8 5 16 4-12 2 4h7' fill='none' stroke='%23ff5f6d' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M2 17h7l3-8 5 16 4-12 2 4h7" /></svg>
      <h1>Tricorder</h1>
    </div>
    <p class="tagline" data-i18n="tagline"></p>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="en">EN</button>
      <button type="button" data-lang="fr">FR</button>
    </div>
  </header>

  <main class="grid">
    <section class="stage-col">
      <div class="stage" id="stage">
        <div class="media" id="media">
          <video id="video" playsinline muted></video>
          <canvas id="overlay"></canvas>
        </div>
        <div class="placeholder" id="placeholder">
          <svg viewBox="0 0 120 120" aria-hidden="true">
            <ellipse cx="60" cy="62" rx="32" ry="42" />
            <rect x="44" y="30" width="32" height="10" rx="2" />
            <circle cx="47" cy="72" r="6" /><circle cx="73" cy="72" r="6" />
          </svg>
        </div>
        <p class="status" id="status" aria-live="polite"></p>
      </div>

      <div class="controls">
        <button type="button" class="btn primary" id="btnCamera" data-i18n="src.camera"></button>
        <button type="button" class="btn" id="btnFile" data-i18n="src.file"></button>
        <input type="file" id="fileInput" accept="video/*" hidden>
        <button type="button" class="btn" id="btnDemo" data-i18n="src.demo"></button>
        <button type="button" class="btn ghost" id="btnStop" data-i18n="src.stop" disabled></button>
      </div>

      <div class="tools">
        <label class="switch">
          <input type="checkbox" id="magnify">
          <span class="track" aria-hidden="true"></span>
          <span data-i18n="magnify.label"></span>
        </label>
        <label class="row gain" id="gainRow" hidden>
          <span id="gainLabel" data-i18n="magnify.gain"></span>
          <input type="range" id="gain" aria-labelledby="gainLabel" min="10" max="150" step="5" value="50">
          <output id="gainOut">×50</output>
        </label>
        <button type="button" class="btn rec" id="btnRecord" disabled>
          <span class="rec-dot" aria-hidden="true"></span><span id="recLabel" data-i18n="rec.start"></span>
        </button>
      </div>
      <p class="hint" id="magnifyHint" hidden data-i18n="magnify.hint"></p>

      <fieldset class="extras">
        <legend data-i18n="extras.title"></legend>
        <label class="row check"><input type="checkbox" id="optHands"><span data-i18n="extras.hands"></span></label>
        <label class="row check"><input type="checkbox" id="optBody"><span data-i18n="extras.body"></span></label>
        <p class="hint" data-i18n="extras.hint"></p>
      </fieldset>

      <div class="card save" id="savePanel" hidden>
        <h2 id="saveTitle"></h2>
        <label class="row">
          <span id="refLabel" data-i18n="rec.ref"></span>
          <input type="number" id="refBpm" aria-labelledby="refLabel" min="30" max="220" step="1" placeholder="72">
        </label>
        <p class="hint" data-i18n="rec.refHint"></p>
        <div class="controls">
          <button type="button" class="btn primary" id="btnSave" data-i18n="rec.save"></button>
          <button type="button" class="btn ghost" id="btnDiscard" data-i18n="rec.discard"></button>
        </div>
      </div>

      <div class="demo-controls" id="demoControls" hidden>
        <label class="row">
          <span id="demoBpmLabel" data-i18n="demo.bpm"></span>
          <input type="range" id="demoBpm" aria-labelledby="demoBpmLabel" min="40" max="180" step="1" value="72">
          <output id="demoBpmOut">72</output>
        </label>
        <label class="row check">
          <input type="checkbox" id="demoFlicker">
          <span data-i18n="demo.flicker"></span>
        </label>
        <label class="row check">
          <input type="checkbox" id="demoHair">
          <span data-i18n="demo.hair"></span>
        </label>
      </div>
    </section>

    <section class="readout">
      <div class="card hr">
        <h2 data-i18n="hr.title"></h2>
        <div class="bpm-line">
          <span class="bpm" id="bpm">—</span>
          <span class="unit">bpm</span>
          <svg class="heart" id="heart" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.5 3 4.5 6.8 4.5c2.1 0 3.6 1.1 5.2 3 1.6-1.9 3.1-3 5.2-3 3.8 0 5.9 4 4.4 7.3C19.5 16.4 12 21 12 21z"/></svg>
        </div>
        <div class="quality" id="quality" data-q="none">
          <span class="dot"></span>
          <span id="qualityLabel"></span>
          <span class="snr" id="snr"></span>
        </div>
        <div class="progress" id="progress" hidden><div id="progressBar"></div></div>
        <p class="truth" id="truth" hidden></p>
      </div>

      <div class="card">
        <h2 data-i18n="wave.title"></h2>
        <canvas class="plot" id="wave"></canvas>
      </div>

      <div class="card">
        <h2 data-i18n="spec.title"></h2>
        <canvas class="plot" id="spectrum"></canvas>
      </div>

      <details class="card details">
        <summary data-i18n="details.title"></summary>
        <p class="mono" id="details">--</p>
      </details>
    </section>
  </main>

  <section class="info">
    <div>
      <h3 data-i18n="tips.title"></h3>
      <ul>
        <li data-i18n="tips.1"></li>
        <li data-i18n="tips.2"></li>
        <li data-i18n="tips.3"></li>
      </ul>
    </div>
    <div>
      <h3 data-i18n="how.title"></h3>
      <p data-i18n="how.body"></p>
    </div>
  </section>

  <footer class="disclaimer">
    <span data-i18n="disclaimer"></span>
    <a href="bench.html" data-i18n="bench.link"></a>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
